server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PROXY para tu backend Flask
    location /api/ {
        proxy_pass http://163.192.112.232:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback (necesario para React Router)
    location / {
        try_files $uri /index.html;
    }
}
